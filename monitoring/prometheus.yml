global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'studyos-app'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['studyos:3000', 'host.docker.internal:3000', 'localhost:3000']
        labels:
          app: 'studyos'
          service: 'frontend-and-api'
          env: 'production'

  - job_name: 'prometheus'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:9090']
